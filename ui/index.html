<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
       http-equiv="Content-Security-Policy"
       content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
     />
    <title>BLAST Audio</title>
    
    <link rel="stylesheet" href="index.css">

</head>


<body>


<div class="audio-panel">


    <!-- =====================================================
         TITOLO
         ===================================================== -->

    <div class="title">

        AUDIO

    </div>


    <!-- =====================================================
         METERS
         ===================================================== -->

    <div class="meters-area">


        <!-- =================================================
             SCALA DB
             ================================================= -->

        <div class="db-scale">

            <span>0</span>
            <span>-6</span>
            <span>-12</span>
            <span>-18</span>
            <span>-24</span>
            <span>-30</span>
            <span>-36</span>
            <span>-42</span>
            <span>-48</span>
            <span>-54</span>
            <span>-60</span>

        </div>


        <!-- =================================================
             MASTER
             ================================================= -->

        <div class="bus" data-bus="master">

            <div class="bus-name">
                MASTER
            </div>


            <div class="stereo-meter">

                <!-- LEFT -->

                <div class="channel">

                    <div class="channel-label">
                        L
                    </div>

                    <div class="meter">

                        <div id="master-left" class="level">
                        </div>

                    </div>

                    <div id="master-left-value" class="value">
                        -∞ dB
                    </div>

                </div>


                <!-- RIGHT -->

                <div class="channel">

                    <div class="channel-label">
                        R
                    </div>

                    <div class="meter">

                        <div id="master-right" class="level">
                        </div>

                    </div>

                    <div id="master-right-value" class="value">
                        -∞ dB
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             BUS A
             ================================================= -->

        <div class="bus" data-bus="busA">

            <div class="bus-name">
                A
            </div>

            <div class="stereo-meter">

                <div class="channel">

                    <div class="channel-label">
                        L
                    </div>

                    <div class="meter">

                        <div id="busA-left" class="level">
                        </div>

                    </div>

                    <div id="busA-left-value" class="value">
                        -∞ dB
                    </div>

                </div>

                <div class="channel">

                    <div class="channel-label">
                        R
                    </div>

                    <div class="meter">

                        <div id="busA-right" class="level">
                        </div>

                    </div>

                    <div id="busA-right-value" class="value">
                        -∞ dB
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             BUS B
             ================================================= -->

        <div class="bus" data-bus="busB">

            <div class="bus-name">
                B
            </div>

            <div class="stereo-meter">

                <div class="channel">

                    <div class="channel-label">
                        L
                    </div>

                    <div class="meter">

                        <div id="busB-left" class="level">
                        </div>

                    </div>

                    <div id="busB-left-value" class="value">
                        -∞ dB
                    </div>

                </div>

                <div class="channel">

                    <div class="channel-label">
                        R
                    </div>

                    <div class="meter">

                        <div id="busB-right" class="level">
                        </div>

                    </div>

                    <div id="busB-right-value" class="value">
                        -∞ dB
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             BUS C
             ================================================= -->

        <div class="bus" data-bus="busC">

            <div class="bus-name">
                C
            </div>

            <div class="stereo-meter">

                <div class="channel">

                    <div class="channel-label">
                        L
                    </div>

                    <div class="meter">

                        <div id="busC-left" class="level">
                        </div>

                    </div>

                    <div id="busC-left-value" class="value">
                        -∞ dB
                    </div>

                </div>

                <div class="channel">

                    <div class="channel-label">
                        R
                    </div>

                    <div class="meter">

                        <div id="busC-right" class="level">
                        </div>

                    </div>

                    <div id="busC-right-value" class="value">
                        -∞ dB
                    </div>

                </div>

            </div>

        </div>

        <!-- =================================================
             BUS D
             ================================================= -->

        <div class="bus" data-bus="busD">

            <div class="bus-name">
                D
            </div>

            <div class="stereo-meter">

                <div class="channel">

                    <div class="channel-label">
                        L
                    </div>

                    <div class="meter">

                        <div id="busD-left" class="level">
                        </div>

                    </div>

                    <div id="busD-left-value" class="value">
                        -∞ dB
                    </div>

                </div>

                <div class="channel">

                    <div class="channel-label">
                        R
                    </div>

                    <div class="meter">

                        <div id="busD-right" class="level">
                        </div>

                    </div>

                    <div id="busD-right-value" class="value">
                        -∞ dB
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- =================================================
     CHANNEL METERS
     ================================================= -->

    <div class="mono-meters">

        <div class="mono-bus" data-channel="CH1">
            <div class="bus-name">CH1</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>

                <div class="meter">
                    <div id="ch1-level" class="level"></div>
                </div>

                <div id="ch1-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>


        <div class="mono-bus" data-channel="CH2">
            <div class="bus-name">CH2</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>

                <div class="meter">
                    <div id="ch2-level" class="level"></div>
                </div>

                <div id="ch2-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>


        <div class="mono-bus" data-channel="CH3">
            <div class="bus-name">CH3</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>

                <div class="meter">
                    <div id="ch3-level" class="level"></div>
                </div>

                <div id="ch3-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>


        <div class="mono-bus" data-channel="CH4">
            <div class="bus-name">CH4</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>

                <div class="meter">
                    <div id="ch4-level" class="level"></div>
                </div>

                <div id="ch4-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>


        <div class="mono-bus" data-channel="CH5">
            <div class="bus-name">CH5</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>

                <div class="meter">
                    <div id="ch5-level" class="level"></div>
                </div>

                <div id="ch5-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>


        <div class="mono-bus" data-channel="CH6">
            <div class="bus-name">CH6</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>

                <div class="meter">
                    <div id="ch6-level" class="level"></div>
                </div>

                <div id="ch6-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>


        <div class="mono-bus" data-channel="CH7">
            <div class="bus-name">CH7</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>

                <div class="meter">
                    <div id="ch7-level" class="level"></div>
                </div>

                <div id="ch7-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>


        <div class="mono-bus" data-channel="CH8">
            <div class="bus-name">CH8</div>

            <div class="mono-meter">
                <div class="channel-label">&nbsp;</div>
                
                <div class="meter">
                    <div id="ch8-level" class="level"></div>
                </div>

                <div id="ch8-value" class="value">
                    -∞ dB
                </div>
            </div>
        </div>

    </div>
        
</div>

<script src="index.js" defer></script>

</body>

</html>
